<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Panel - EventEase</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

</head>


<body>

    <!-- Navigation -->
    <header>

        <nav class="navbar">

            <div class="logo">
                EventEase Admin
            </div>

            <ul class="nav-links">

                <li>
                    <a href="../index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="dashboard.html">
                        Dashboard
                    </a>
                </li>

            </ul>

            <button
                id="logoutBtn"
                class="btn-primary"
            >
                Logout
            </button>

        </nav>

    </header>


    <!-- Admin Panel -->
    <main class="dashboard-container">

        <section class="dashboard-header">

            <div>

                <p class="dashboard-label">
                    Administration
                </p>

                <h1>
                    EventEase Admin Panel 👑
                </h1>

                <p>
                    Manage customer event bookings.
                </p>

            </div>

        </section>


        <!-- Statistics -->
        <section class="dashboard-cards">

            <div class="dashboard-card">

                <h3>
                    📋 Total Bookings
                </h3>

                <p
                    id="totalBookings"
                    style="font-size: 2rem;"
                >
                    0
                </p>

            </div>


            <div class="dashboard-card">

                <h3>
                    ⏳ Pending
                </h3>

                <p
                    id="pendingBookings"
                    style="font-size: 2rem;"
                >
                    0
                </p>

            </div>


            <div class="dashboard-card">

                <h3>
                    ✅ Confirmed
                </h3>

                <p
                    id="confirmedBookings"
                    style="font-size: 2rem;"
                >
                    0
                </p>

            </div>

        </section>


        <!-- Customer Bookings -->
        <section class="bookings-section">

            <div class="section-heading">

                <h2>
                    Customer Bookings
                </h2>

                <p>
                    All customer event bookings will appear here.
                </p>

            </div>


            <div id="adminBookingsList">

                <p class="loading-message">
                    Loading bookings...
                </p>

            </div>

        </section>


        <!-- Message -->
        <p
            id="adminMessage"
            class="auth-message"
        ></p>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../supabase.js"></script>


    <!-- Admin JavaScript -->
    <script>

        document.addEventListener(
            "DOMContentLoaded",
            async function () {

                console.log("Admin page loaded.");


                const message =
                    document.getElementById("adminMessage");

                const bookingsList =
                    document.getElementById("adminBookingsList");

                const logoutBtn =
                    document.getElementById("logoutBtn");


                // ------------------------------------------
                // 1. Check logged-in user
                // ------------------------------------------

                const {
                    data: {
                        user
                    },
                    error: userError
                } =
                    await supabaseClient.auth.getUser();


                if (userError || !user) {

                    window.location.href = "login.html";

                    return;

                }


                console.log("Logged-in user:", user);


                // ------------------------------------------
                // 2. Get user's profile
                // ------------------------------------------

                const {
                    data: profile,
                    error: profileError
                } =
                    await supabaseClient
                        .from("profiles")
                        .select("*")
                        .eq("id", user.id)
                        .single();


                if (profileError || !profile) {

                    message.textContent =
                        "Unable to load your profile.";

                    bookingsList.innerHTML = "";

                    return;

                }


                console.log("User profile:", profile);


                // ------------------------------------------
                // 3. Check admin role
                // ------------------------------------------

                if (profile.role !== "admin") {

                    message.textContent =
                        "Access denied. Admin access required.";

                    bookingsList.innerHTML = "";

                    return;

                }


                console.log("Admin access granted.");


                // ------------------------------------------
                // 4. Load all bookings
                // ------------------------------------------

                const {
                    data: bookings,
                    error: bookingsError
                } =
                    await supabaseClient
                        .from("bookings")
                        .select("*")
                        .order(
                            "created_at",
                            {
                                ascending: false
                            }
                        );


                if (bookingsError) {

                    console.error(
                        "Bookings error:",
                        bookingsError
                    );

                    message.textContent =
                        "Unable to load bookings: " +
                        bookingsError.message;

                    bookingsList.innerHTML = "";

                    return;

                }


                console.log(
                    "Bookings loaded:",
                    bookings
                );


                // ------------------------------------------
                // 5. Statistics
                // ------------------------------------------

                document.getElementById(
                    "totalBookings"
                ).textContent = bookings.length;


                const pendingCount =
                    bookings.filter(function (booking) {

                        return booking.status === "pending";

                    }).length;


                const confirmedCount =
                    bookings.filter(function (booking) {

                        return booking.status === "confirmed";

                    }).length;


                document.getElementById(
                    "pendingBookings"
                ).textContent = pendingCount;


                document.getElementById(
                    "confirmedBookings"
                ).textContent = confirmedCount;


                // ------------------------------------------
                // 6. No bookings
                // ------------------------------------------

                if (bookings.length === 0) {

                    bookingsList.innerHTML =
                        `
                        <div class="empty-bookings">

                            <h3>
                                No bookings yet
                            </h3>

                            <p>
                                Customer bookings
                                will appear here.
                            </p>

                        </div>
                        `;

                    return;

                }


                // ------------------------------------------
                // 7. Display bookings
                // ------------------------------------------

                bookingsList.innerHTML = "";


                bookings.forEach(function (booking) {

                    const card =
                        document.createElement("div");


                    card.className =
                        "booking-card";


                    card.innerHTML =
                        `
                        <h3>
                            ${booking.event_type}
                        </h3>

                        <p>
                            <strong>
                                Event Date:
                            </strong>
                            ${booking.event_date}
                        </p>

                        <p>
                            <strong>
                                Venue:
                            </strong>
                            ${booking.venue || "Not specified"}
                        </p>

                        <p>
                            <strong>
                                Guests:
                            </strong>
                            ${booking.guest_count || "Not specified"}
                        </p>

                        <p>
                            <strong>
                                Budget:
                            </strong>
                            ₹${booking.budget || "Not specified"}
                        </p>

                        <p>
                            <strong>
                                Current Status:
                            </strong>
                            ${booking.status}
                        </p>

                        <div style="margin-top: 15px;">

                            <label
                                for="status-${booking.id}"
                            >
                                <strong>
                                    Update Status:
                                </strong>
                            </label>

                            <select
                                id="status-${booking.id}"
                                class="booking-status"
                                data-booking-id="${booking.id}"
                                style="
                                    display: block;
                                    margin-top: 8px;
                                    padding: 8px;
                                    width: 100%;
                                    max-width: 250px;
                                "
                            >

                                <option
                                    value="pending"
                                    ${booking.status === "pending" ? "selected" : ""}
                                >
                                    Pending
                                </option>

                                <option
                                    value="confirmed"
                                    ${booking.status === "confirmed" ? "selected" : ""}
                                >
                                    Confirmed
                                </option>

                                <option
                                    value="completed"
                                    ${booking.status === "completed" ? "selected" : ""}
                                >
                                    Completed
                                </option>

                                <option
                                    value="cancelled"
                                    ${booking.status === "cancelled" ? "selected" : ""}
                                >
                                    Cancelled
                                </option>

                            </select>

                        </div>
                        `;


                    bookingsList.appendChild(card);


                    // --------------------------------------
                    // Status change
                    // --------------------------------------

                    const statusSelect =
                        card.querySelector(
                            ".booking-status"
                        );


                    statusSelect.addEventListener(
                        "change",
                        async function () {

                            const newStatus =
                                statusSelect.value;

                            const bookingId =
                                statusSelect.dataset.bookingId;


                            statusSelect.disabled = true;


                            const {
                                error
                            } =
                                await supabaseClient
                                    .from("bookings")
                                    .update({
                                        status: newStatus
                                    })
                                    .eq(
                                        "id",
                                        bookingId
                                    );


                            if (error) {

                                console.error(
                                    "Status update error:",
                                    error
                                );

                                alert(
                                    "Failed to update booking: " +
                                    error.message
                                );

                                statusSelect.disabled = false;

                                return;

                            }


                            alert(
                                "Booking status updated successfully!"
                            );


                            window.location.reload();

                        }
                    );

                });


            }
        );


        // ------------------------------------------
        // Logout
        // ------------------------------------------

        document
            .getElementById("logoutBtn")
            .addEventListener(
                "click",
                async function () {

                    const {
                        error
                    } =
                        await supabaseClient
                            .auth
                            .signOut();


                    if (error) {

                        alert(
                            "Logout failed: " +
                            error.message
                        );

                        return;

                    }


                    window.location.href =
                        "login.html";

                }
            );

    </script>

</body>

</html>
