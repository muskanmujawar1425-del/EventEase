<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - EventEase</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav>

            <div class="logo">
                EventEase
            </div>

            <ul class="nav-links">
                <li>
                    <a href="../index.html">Home</a>
                </li>

                <li>
                    <a href="../index.html#about">About</a>
                </li>

                <li>
                    <a href="../index.html#services">Services</a>
                </li>

                <li>
                    <a href="../index.html#events">Events</a>
                </li>
            </ul>

            <div class="nav-buttons">

                <a href="login.html">
                    Login
                </a>

            </div>

        </nav>
    </header>


    <!-- Registration Section -->

    <main>

        <section class="auth-section">

            <div class="auth-container">

                <div class="auth-header">

                    <p class="welcome-text">
                        Welcome to EventEase
                    </p>

                    <h1>
                        Create Your Account
                    </h1>

                    <p>
                        Register to start planning and managing
                        your events.
                    </p>

                </div>


                <!-- Registration Form -->

                <form id="registerForm">

                    <div class="form-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                            minlength="6"
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Create Account
                    </button>


                    <p
                        id="registerMessage"
                        class="form-message"
                    ></p>

                </form>


                <div class="auth-footer">

                    <p>
                        Already have an account?
                        <a href="login.html">
                            Login here
                        </a>
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            &copy; 2026 EventEase. All rights reserved.
        </p>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../supabase.js"></script>

<script src="../script.js"></script>

</body>

</html>
